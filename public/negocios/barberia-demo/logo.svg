<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="Barbería Demo">
  <defs>
    <!-- franjas del poste: rojo, blanco, azul, blanco -->
    <pattern id="franjas" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="16" height="16" fill="#f7f3ea"/>
      <rect width="16" height="4" fill="#c3202f"/>
      <rect y="8" width="16" height="4" fill="#1d4e9e"/>
    </pattern>
  </defs>
  <!-- emblema azul con doble filete -->
  <circle cx="48" cy="48" r="45" fill="#13233f"/>
  <circle cx="48" cy="48" r="40" stroke="#f7f3ea" stroke-width="1.6"/>
  <circle cx="48" cy="48" r="36.5" stroke="#c3202f" stroke-width="1.2"/>
  <!-- poste de barbero -->
  <circle cx="48" cy="18.5" r="3.6" fill="#f7f3ea"/>
  <rect x="38" y="22" width="20" height="5" rx="2.5" fill="#f7f3ea"/>
  <rect x="41" y="27" width="14" height="42" fill="url(#franjas)"/>
  <rect x="41" y="27" width="14" height="42" stroke="#f7f3ea" stroke-width="1.4"/>
  <rect x="38" y="69" width="20" height="5" rx="2.5" fill="#f7f3ea"/>
  <!-- estrellas a los costados -->
  <polygon points="25.0,43.0 26.2,46.3 29.8,46.5 27.0,48.6 27.9,52.0 25.0,50.1 22.1,52.0 23.0,48.6 20.2,46.5 23.8,46.3" fill="#f7f3ea"/>
  <polygon points="71.0,43.0 72.2,46.3 75.8,46.5 73.0,48.6 73.9,52.0 71.0,50.1 68.1,52.0 69.0,48.6 66.2,46.5 69.8,46.3" fill="#f7f3ea"/>
</svg>
